name: compatgraph

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: compatgraph
      POSTGRES_USER: compatgraph
      POSTGRES_PASSWORD: compatgraph
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compatgraph -d compatgraph"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - compatgraph-postgres:/var/lib/postgresql/data

volumes:
  compatgraph-postgres:
