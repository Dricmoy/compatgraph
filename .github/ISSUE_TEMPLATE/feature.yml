name: Product milestone
description: Propose a user-visible CompatGraph capability
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What should a user be able to do that they cannot do now?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observable behavior
      description: Describe the complete user journey and expected result.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance evidence
      description: List the tests, screenshots, output, or deployed behavior that will prove completion.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks and recovery
      description: Note data, security, migration, performance, or rollback concerns.
