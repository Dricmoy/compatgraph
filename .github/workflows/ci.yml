name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://compatgraph:compatgraph@localhost:5432/compatgraph
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: compatgraph
          POSTGRES_USER: compatgraph
          POSTGRES_PASSWORD: compatgraph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compatgraph -d compatgraph"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Migrate and seed PostgreSQL
        run: pnpm db:migrate && pnpm db:seed
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Run unit tests
        run: pnpm test
      - name: Build production application
        run: pnpm build

  browser:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://compatgraph:compatgraph@localhost:5432/compatgraph
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: compatgraph
          POSTGRES_USER: compatgraph
          POSTGRES_PASSWORD: compatgraph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compatgraph -d compatgraph"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Migrate and seed PostgreSQL
        run: pnpm db:migrate && pnpm db:seed
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser tests
        run: pnpm test:e2e
